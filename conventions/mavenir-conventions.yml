events:
  style: websocket-channel + web-push
  note: >-
    Notifications are not HTTP callbacks. RACM session creation returns
    notificationChannelInformation.channelURL, a WebSocket URL the client opens;
    device push tokens are registered separately via POST /push (Web Push FCM).
  artifact: asyncapi/mavenir-byon-events.yml
media_types:
  request: application/json
  response: application/json
  embedded:
    sdp: >-
      SDP bodies (RFC 4566) are carried inline as strings inside offer.sdp and
      answer.sdp, with CRLF line endings preserved. If XML syntax is used the spec
      requires the content be embedded in a CDATA section.
