name: Mavenir
kind: company
description: >-
  Mavenir is a US-headquartered (Richardson, Texas) cloud-native telecom network
  software vendor that builds the software operators run rather than a network
  or a developer platform of its own. Its portfolio spans Open RAN and vRAN
  (MAVair), converged packet core and cloud-native IMS (MAVcore), messaging,
  fraud and security applications, the Mavenir Digital Enablement (MDE) BSS and
  converged charging stack (MAVapps), private networks, MEC and an Intelligent
  IoT Platform (MAVedge). In the telecom value chain Mavenir sits upstream of the
  carrier — it supplies the Combo NEF/SCEF network-exposure function and the BSS
  that a mobile operator uses to expose and monetize CAMARA and GSMA Open Gateway
  network APIs, but it does not expose those APIs to developers itself. Its API
  posture is accordingly partner-gated and sales-led: there is no developer
  portal at any developer/docs/api subdomain, no self-serve signup, no sandbox,
  and no downloadable specification on mavenir.com; the only login-bearing
  surface, support.mavenir.com, is an ADFS-protected customer support wall.
  What Mavenir does publish is standards work — it is an active CAMARA
  participant with eleven named individuals in CAMARA governance, is listed in
  the CAMARA landscape as a Network Capability Solution Provider, co-maintains
  the camaraproject/WebRTC sandbox API repository (two of the four CODEOWNERS
  are Mavenir engineers), contributed its own Bring Your Own Number (BYON)
  OpenAPI definitions to the CAMARA API Backlog, and holds TM Forum Open API
  Platinum conformance with 20+ certified Open APIs on the MDE BSS platform.
  Developers reach Mavenir-powered capability only through a carrier or through
  a channel partner such as Spry Fox Networks, never directly.
