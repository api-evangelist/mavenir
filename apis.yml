apis:
- aid: mavenir:mavenir-byon-call-handling-api
  name: Mavenir BYON Call Handling API (VVoIP Service)
  description: >-
    A Mavenir-authored OpenAPI 3.0.0 definition for a Bring Your Own Number
    (BYON) one-to-one voice and video calling service over WebRTC, contributed
    by Mavenir (contact@mavenir.com, Apache 2.0) to the CAMARA API Backlog as a
    supporting document for the WebRTC API proposal that Mavenir co-maintains.
    Four operations create, retrieve, update the status of and delete a VVoIP
    session, exchanging SDP offers and answers. This is a contributed reference
    definition in a public standards repository, not a Mavenir-hosted commercial
    endpoint — the spec ships only a templated {apiRoot} server whose default is
    http://localhost:9091, and authentication is HTTP Bearer.
  humanURL: https://github.com/camaraproject/APIBacklog/blob/main/documentation/SupportingDocuments/BYON-CallHandling-Service.yaml
  tags:
  - Voice
  - Video
  - WebRTC
  - VVoIP
  - CAMARA
  properties:
  - type: OpenAPI
    url: openapi/mavenir-byon-call-handling-openapi.yml
  - type: Documentation
    url: https://github.com/camaraproject/WebRTC
  - type: APIReference
    url: https://raw.githubusercontent.com/camaraproject/APIBacklog/main/documentation/SupportingDocuments/BYON-CallHandling-Service.yaml
- aid: mavenir:mavenir-byon-racm-api
  name: Mavenir BYON Registration and Connectivity Management (RACM) API
  description: >-
    A Mavenir-authored OpenAPI 3.0.0 definition for Bring Your Own Number (BYON)
    Registration and Connectivity Management, giving a REST client the ability
    to register into and manage its connectivity toward a mobile network
    operator's IMS network. Four operations create, refresh and delete a RACM
    session and register a push channel. Contributed by Mavenir to the CAMARA
    API Backlog as a supporting document for the WebRTC API proposal; it is a
    standards-track reference definition, not a hosted Mavenir endpoint, with a
    templated {apiRoot} server defaulting to http://localhost:9091 and HTTP
    Bearer authentication.
  humanURL: https://github.com/camaraproject/APIBacklog/blob/main/documentation/SupportingDocuments/BYON-RACM-Service.yaml
  tags:
  - IMS
  - Registration
  - Connectivity
  - WebRTC
  - CAMARA
  properties:
  - type: OpenAPI
    url: openapi/mavenir-byon-racm-openapi.yml
  - type: Documentation
    url: https://github.com/camaraproject/WebRTC
  - type: APIReference
    url: https://raw.githubusercontent.com/camaraproject/APIBacklog/main/documentation/SupportingDocuments/BYON-RACM-Service.yaml
- aid: mavenir:mavenir-digital-enablement-tm-forum-open-apis
  name: Mavenir Digital Enablement (MDE) TM Forum Open APIs
  description: >-
    The TM Forum Open APIs implemented in Mavenir's cloud-native Digital
    Enablement (MDE) BSS, converged charging and digital marketplace platform.
    Mavenir holds TM Forum Open API Conformance certification for this product:
    Silver on 2022-10-06 covering TMF620 Product Catalog Management, TMF622
    Product Ordering, TMF629 Customer Management, TMF632 Party Management and
    TMF667 Document Management, then Platinum on 2023-09-20 with 20+ certified
    Open APIs. The certification is real, published and verifiable through TM
    Forum, and the interface contracts are TM Forum's public specifications —
    but Mavenir itself publishes no public API reference, no OpenAPI download
    and no endpoint for these APIs. They are delivered inside a licensed
    operator deployment and are reachable only under a commercial engagement.
    The individual 20 certified TMF numbers behind the Platinum tier were not
    itemized in Mavenir's announcement.
  humanURL: https://www.mavenir.com/portfolio/mavapps/mavenir-digital-enablement-bss/
